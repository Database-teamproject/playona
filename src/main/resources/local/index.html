<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playona 로컬 테스트</title>
<style>
  body { max-width: 800px; margin: 48px auto; padding: 0 20px; font-family: system-ui, sans-serif; color: #202124; }
  input, button { padding: 12px; font: inherit; }
  input { flex: 1; min-width: 0; }
  form { display: flex; gap: 8px; }
  button { cursor: pointer; }
  li { margin: 12px 0; }
  pre { background: #f3f4f6; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>Playona 로컬 테스트</h1>
<p>음악 링크를 입력하면 로컬 서버에서 곡을 매칭합니다. 외부 음악 API를 조회하며 결과는 로컬 DB에 저장됩니다.</p>
<form id="form">
  <input id="url" type="url" aria-label="음악 링크" placeholder="유튜브·스포티파이 등의 음악 링크" required>
  <button id="submit">테스트</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<h2 id="track"></h2>
<ul id="platforms"></ul>
<details><summary>API 응답</summary><pre id="response"></pre></details>
<script>
  const form = document.querySelector('#form');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const platforms = document.querySelector('#platforms');
    button.disabled = true;
    status.textContent = '매칭 중… 잠시 기다려 주세요.';
    platforms.replaceChildren();
    document.querySelector('#track').textContent = '';
    document.querySelector('#response').textContent = '';
    try {
      const response = await fetch('/api/links', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: document.querySelector('#url').value.trim()})
      });
      const result = await response.json();
      document.querySelector('#response').textContent = JSON.stringify(result, null, 2);
      if (!response.ok || !result.success) throw new Error(result.message || `HTTP ${response.status}`);
      const data = result.data;
      document.querySelector('#track').textContent = `${data.trackTitle} — ${data.trackArtist}`;
      status.textContent = `완료 · ${data.platforms.length}개 플랫폼 · 코드 ${data.shortCode}`;
      for (const platform of data.platforms) {
        const url = new URL(platform.url);
        if (!['http:', 'https:'].includes(url.protocol)) continue;
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.textContent = platform.name;
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        item.append(link);
        platforms.append(item);
      }
    } catch (error) {
      status.textContent = `실패: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
